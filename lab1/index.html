<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №1 — Расчет зарплаты</title>
    <link rel="stylesheet" href="look.css">
    <script type="text/javascript" src="logic.js"></script>
</head>
<body>
    <div class="container">
        <h1>Расчет заработной платы</h1>
        <p class="description">
            Сценарий определяет зарплату работнику при почасовой оплате.<br>
            <strong>Событие расчета срабатывает при получении фокуса</strong> полем «Итоговая зарплата» (кликните в поле или перейдите клавишей Tab).
        </p>

        <form class="salary-form" onsubmit="return false;">
            <div class="form-group">
                <label for="hours">Количество отработанных часов:</label>
                <input type="number" id="hours" min="0" step="any" placeholder="Например: 160">
            </div>

            <div class="form-group">
                <label for="rate">Оплата за один час (руб.):</label>
                <input type="number" id="rate" min="0" step="any" placeholder="Например: 450">
            </div>

            <div class="form-group">
                <label for="salary">Итоговая зарплата (фокус запускает расчет):</label>
                <input type="text" id="salary" placeholder="Нажмите сюда для расчета" readonly>
            </div>

            <div class="actions">
                <button type="button" id="resetBtn" class="btn btn-reset">Сбросить</button>
            </div>

            <div id="resultMessage" class="result-box hidden"></div>
        </form>
    </div>
</body>
</html>
