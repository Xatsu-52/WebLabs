<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа №1 — Расчет зарплаты</title>
    <link rel="stylesheet" href="look.css">
    <script type="text/javascript" src="logic.js"></script>
</head>
<body>
    <div class="container">
        <h1>Расчет заработной платы</h1>
        <p class="description">
            Определение зарплаты работника при почасовой оплате.<br>
        </p>

        <form class="salary-form" onsubmit="return false;">
            <div class="form-group">
                <label for="hours">Количество отработанных часов:</label>
                <input type="number" id="hours" min="0" step="any" placeholder="Например: 160">
            </div>

            <div class="form-group">
                <label for="rate">Оплата за один час (руб.):</label>
                <input type="number" id="rate" min="0" step="any" placeholder="Например: 450">
            </div>

            <div class="form-group">
                <label for="salary">Итоговая зарплата:</label>
                <input type="text" id="salary" placeholder="Рассчитать" readonly>
            </div>

            <div class="actions">
                <button type="button" id="resetBtn" class="btn btn-reset">Сбросить</button>
            </div>

            <div id="resultMessage" class="result-box hidden"></div>
        </form>
    </div>
</body>
</html>
